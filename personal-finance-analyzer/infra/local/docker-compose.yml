services:
  mysql:
    image: mysql:8.4
    container_name: finance-analyzer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: finance_analyzer
      MYSQL_USER: finance_app
      MYSQL_PASSWORD: change_me_local_only
      MYSQL_ROOT_PASSWORD: change_root_local_only
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - finance_mysql_data:/var/lib/mysql
volumes:
  finance_mysql_data:
