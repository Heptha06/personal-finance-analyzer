services:
  mysql:
    image: mysql:8.4
    container_name: finance-analyzer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: finance_analyzer
      MYSQL_USER: finance_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD to a local MySQL application password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD to a local MySQL root password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - finance_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
volumes:
  finance_mysql_data:
