spring:
  application:
    name: personal-finance-analyzer
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/finance_analyzer}
    username: ${DB_USERNAME:finance_app}
    password: ${DB_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8080
