spring:
  application:
    name: personal-finance-analyzer
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/finance_analyzer}
    username: ${DB_USERNAME:finance_app}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: 8080
